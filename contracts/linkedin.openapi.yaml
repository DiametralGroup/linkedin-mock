  /rest/organizationalEntityShareStatistics:
    get:
      summary: Share statistics — lifetime, per-share, or time-bound buckets
      description: 'No parameter: the organization-wide lifetime aggregate (rolling
        12-month window on the buckets). `shares=List(...)`/`ugcPosts=List(...)`:
        one element per ACTIVE post — posts with no activity are omitted ("can be
        assumed to have counts of 0"). `timeIntervals=(timeRange:(start:ms,end:ms),timeGranularityType:DAY|MONTH)`:
        one element per bucket. The per-share + timeIntervals combination is refused
        by default — documented behavior of the real API.'
      operationId: share_stats_rest_organizationalEntityShareStatistics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
