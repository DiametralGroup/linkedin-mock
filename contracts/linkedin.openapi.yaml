components:
  schemas:
    ArticleContent:
      properties:
        source:
          type: string
          title: Source
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      additionalProperties: true
      type: object
      required:
      - source
      title: ArticleContent
    Distribution:
      properties:
        feedDistribution:
          type: string
          title: Feeddistribution
          description: MAIN_FEED | NONE
        thirdPartyDistributionChannels:
          items:
            type: string
          type: array
          title: Thirdpartydistributionchannels
      additionalProperties: true
      type: object
      required:
      - feedDistribution
      title: Distribution
    ElementsEnvelope_FollowerStatsElement_:
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        elements:
          items:
            $ref: '#/components/schemas/FollowerStatsElement'
          type: array
          title: Elements
      additionalProperties: true
      type: object
      required:
      - paging
      - elements
      title: ElementsEnvelope[FollowerStatsElement]
    ElementsEnvelope_PageStatsElement_:
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        elements:
          items:
            $ref: '#/components/schemas/PageStatsElement'
          type: array
          title: Elements
      additionalProperties: true
      type: object
      required:
      - paging
      - elements
      title: ElementsEnvelope[PageStatsElement]
    ElementsEnvelope_Post_:
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        elements:
          items:
            $ref: '#/components/schemas/Post'
          type: array
          title: Elements
      additionalProperties: true
      type: object
      required:
      - paging
      - elements
      title: ElementsEnvelope[Post]
    ElementsEnvelope_ShareStatsElement_:
      properties:
        paging:
          $ref: '#/components/schemas/Paging'
        elements:
          items:
            $ref: '#/components/schemas/ShareStatsElement'
          type: array
          title: Elements
      additionalProperties: true
      type: object
      required:
      - paging
      - elements
      title: ElementsEnvelope[ShareStatsElement]
    FollowerCounts:
      properties:
        organicFollowerCount:
          type: integer
          title: Organicfollowercount
        paidFollowerCount:
          type: integer
          title: Paidfollowercount
      additionalProperties: true
      type: object
      required:
      - organicFollowerCount
      - paidFollowerCount
      title: FollowerCounts
      description: 'Demographics roll the paid count into the organic one — official
        note:

        "Do not refer to the paidFollowerCount field".'
    FollowerFacet:
      properties:
        followerCounts:
          $ref: '#/components/schemas/FollowerCounts'
        associationType:
          anyOf:
          - type: string
          - type: 'null'
          title: Associationtype
        geo:
          anyOf:
          - type: string
          - type: 'null'
          title: Geo
          x-linkedin-confidence: unverified
          x-linkedin-note: the urn:li:geo:… integers are plausible, not attested segment
            by segment
        function:
          anyOf:
          - type: string
          - type: 'null'
          title: Function
          x-linkedin-confidence: unverified
          x-linkedin-note: semantics of the urn:li:function:… integers are plausible
        industry:
          anyOf:
          - type: string
          - type: 'null'
          title: Industry
          x-linkedin-confidence: unverified
          x-linkedin-note: semantics of the urn:li:industry:… integers are plausible
        seniority:
          anyOf:
          - type: string
          - type: 'null'
          title: Seniority
          x-linkedin-confidence: unverified
          x-linkedin-note: semantics of the urn:li:seniority:… integers are plausible
        staffCountRange:
          anyOf:
          - type: string
          - type: 'null'
          title: Staffcountrange
      additionalProperties: true
      type: object
      required:
      - followerCounts
      title: FollowerFacet
    FollowerGains:
      properties:
        organicFollowerGain:
          type: integer
          title: Organicfollowergain
          description: NET gain — can be negative.
        paidFollowerGain:
          type: integer
          title: Paidfollowergain
      additionalProperties: true
      type: object
      required:
      - organicFollowerGain
      - paidFollowerGain
      title: FollowerGains
    FollowerStatsElement:
      properties:
        timeRange:
          anyOf:
          - $ref: '#/components/schemas/TimeRange'
          - type: 'null'
        followerGains:
          anyOf:
          - $ref: '#/components/schemas/FollowerGains'
          - type: 'null'
        followerCountsByAssociationType:
          anyOf:
          - items:
              $ref: '#/components/schemas/FollowerFacet'
            type: array
          - type: 'null'
          title: Followercountsbyassociationtype
        followerCountsByGeoCountry:
          anyOf:
          - items:
              $ref: '#/components/schemas/FollowerFacet'
            type: array
          - type: 'null'
          title: Followercountsbygeocountry
        followerCountsByFunction:
          anyOf:
          - items:
              $ref: '#/components/schemas/FollowerFacet'
            type: array
          - type: 'null'
          title: Followercountsbyfunction
        followerCountsByIndustry:
          anyOf:
          - items:
              $ref: '#/components/schemas/FollowerFacet'
            type: array
          - type: 'null'
          title: Followercountsbyindustry
        followerCountsByGeo:
          anyOf:
          - items:
              $ref: '#/components/schemas/FollowerFacet'
            type: array
          - type: 'null'
          title: Followercountsbygeo
        followerCountsBySeniority:
          anyOf:
          - items:
              $ref: '#/components/schemas/FollowerFacet'
            type: array
          - type: 'null'
          title: Followercountsbyseniority
        followerCountsByStaffCountRange:
          anyOf:
          - items:
              $ref: '#/components/schemas/FollowerFacet'
            type: array
          - type: 'null'
          title: Followercountsbystaffcountrange
        organizationalEntity:
          type: string
          title: Organizationalentity
      additionalProperties: true
      type: object
      required:
      - organizationalEntity
      title: FollowerStatsElement
      description: 'Lifetime: the 7 facet families. Time-bound: `followerGains` per

        bucket — facets aren''t served in time-bound mode.'
    HTTPValidationError:
      properties:
