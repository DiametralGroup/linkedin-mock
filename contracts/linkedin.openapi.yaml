  /rest/organizationPageStatistics:
    get:
      summary: Page statistics — views (lifetime) or daily buckets
      description: 'Dialect TRAP: the finder is `q=organization` and the parameter
        `organization` — not `organizationalEntity` like the other two. Lifetime:
        `totalPageStatistics` (15 view counters, verified arithmetic) + 6 facets.
        Time-bound (DAY|MONTH): reduced set of families, with `uniquePageViews`.'
      operationId: page_stats_rest_organizationPageStatistics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
