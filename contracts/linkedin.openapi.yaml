components:
  schemas:
    ClicsPage:
      properties:
        desktopCustomButtonClickCounts:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Desktopcustombuttonclickcounts
        mobileCustomButtonClickCounts:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Mobilecustombuttonclickcounts
      additionalProperties: true
      type: object
      title: ClicsPage
    CompteursAbonnes:
      properties:
        organicFollowerCount:
          type: integer
          title: Organicfollowercount
        paidFollowerCount:
          type: integer
          title: Paidfollowercount
      additionalProperties: true
      type: object
      required:
      - organicFollowerCount
      - paidFollowerCount
      title: CompteursAbonnes
      description: 'Les démographies roulent le payant dans l''organique — note officielle
        :

        « Do not refer to the paidFollowerCount field ».'
    ContenuArticle:
      properties:
        source:
          type: string
          title: Source
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      additionalProperties: true
      type: object
      required:
      - source
      title: ContenuArticle
    ContenuMedia:
      properties:
        id:
          type: string
          title: Id
          description: urn:li:video:… | urn:li:image:… | urn:li:document:…
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      additionalProperties: true
      type: object
      required:
      - id
      title: ContenuMedia
    ContenuPost:
      properties:
        media:
          anyOf:
          - $ref: '#/components/schemas/ContenuMedia'
          - type: 'null'
        article:
          anyOf:
          - $ref: '#/components/schemas/ContenuArticle'
          - type: 'null'
      additionalProperties: true
      type: object
      title: ContenuPost
      description: Le bloc `content` — `{}` sur certains posts texte, absent sur d'autres.
    ContexteRepartage:
      properties:
        parent:
          type: string
          title: Parent
        root:
          anyOf:
          - type: string
          - type: 'null'
          title: Root
      additionalProperties: true
      type: object
      required:
      - parent
      title: ContexteRepartage
      description: 'Présent sur les repartages : le post relayé (`parent`) et l''origine.'
    Distribution:
      properties:
        feedDistribution:
          type: string
          title: Feeddistribution
          description: MAIN_FEED | NONE
        thirdPartyDistributionChannels:
          items:
            type: string
          type: array
          title: Thirdpartydistributionchannels
      additionalProperties: true
      type: object
      required:
      - feedDistribution
      title: Distribution
    ElementStatsAbonnes:
      properties:
