openapi: 3.1.0
info:
  title: LinkedIn mock
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      description: Unauthenticated — it is a probe, not an entity.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /rest/posts:
    get:
      summary: Finder by author — the organization's posts
      description: 'Finder `q=author&author={urn}` : tri `sortBy=LAST_MODIFIED` (défaut)
        ou `CREATED`, descendant ; pagination `start`/`count` (défaut 10, plafond
        100), fin de données = page courte. La MÊME route sert le batch get `?ids=List(urn,urn)`
        — réponse `{results, statuses, errors}` par URN, non décrite par ce schéma.'
      operationId: lister_posts_rest_posts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnveloppeElements_Post_'
        '400':
          description: 'Paramètre `q` absent ou inconnu, URN malformé, `count` hors
            bornes, granularité invalide — ou en-tête `Linkedin-Version` absent (`code:
            VERSION_MISSING`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurLinkedIn'
        '401':
          description: 'Jeton absent (`Empty oauth2_access_token`), invalide, expiré
            ou révoqué. Un 401 n''est PAS retryable : c''est un état du jeton.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurLinkedIn'
        '403':
          description: Organisation non administrée par le jeton (ACCESS_DENIED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurLinkedIn'
        '404':
          description: Entité inconnue ou organisation inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurLinkedIn'
        '426':
          description: Version retirée ou inexistante (`NONEXISTENT_VERSION`) — LinkedIn
            retire une version ~12 mois après sa publication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurLinkedIn'
        '429':
          description: Quota JOURNALIER atteint — remise à zéro à minuit UTC, SANS
            en-tête Retry-After (différence clé avec BoondManager).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurLinkedIn'
        '500':
          description: Panne injectée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurLinkedIn'
        '503':
          description: Panne transitoire injectée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurLinkedIn'
