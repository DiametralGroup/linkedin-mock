[project]
name = "linkedin-mock"
version = "0.1.0"
description = "LinkedIn Community Management API mock — container image and installable Python package"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"

# Deliberately minimal, like boondmanager-mock: a mock only needs FastAPI
# and uvicorn. Every extra dependency is attack surface and megabytes of
# image for nothing.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
linkedin-mock = "linkedin_mock.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_mock"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "ARG"]
ignore = ["PLR0913", "PLR2004", "PLC0415"]   # deferred imports are deliberate and structural

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
pythonpath = ["."]
