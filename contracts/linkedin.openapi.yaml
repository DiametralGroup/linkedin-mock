  /rest/organizationalEntityShareStatistics:
    get:
      summary: Share statistics — lifetime, per-share, or time-bound buckets
      description: 'Sans paramètre : l''agrégat organisation vie entière (fenêtre
        glissante de 12 mois sur les buckets). `shares=List(...)`/`ugcPosts=List(...)`
        : un élément par post ACTIF — les posts sans activité sont omis (« can be
        assumed to have counts of 0 »). `timeIntervals=(timeRange:(start:ms,end:ms),timeGranularityType:DAY|MONTH)`
        : un élément par bucket. La combinaison per-share + timeIntervals est refusée
        par défaut — comportement documenté de l''API réelle.'
