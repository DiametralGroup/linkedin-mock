openapi: 3.1.0
info:
  title: LinkedIn mock
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      description: Unauthenticated — it is a probe, not an entity.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /rest/posts:
    get:
      summary: Finder by author — the organization's posts
      description: 'Finder `q=author&author={urn}`: sort `sortBy=LAST_MODIFIED` (default)
        or `CREATED`, descending; pagination `start`/`count` (default 10, cap 100),
        end of data = short page. The SAME route serves the batch get `?ids=List(urn,urn)`
        — response `{results, statuses, errors}` per URN, not described by this schema.'
      operationId: list_posts_rest_posts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementsEnvelope_Post_'
        '400':
          description: 'Missing or unknown `q` parameter, malformed URN, `count` out
            of bounds, invalid granularity — or missing `Linkedin-Version` header
            (`code: VERSION_MISSING`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedInError'
        '401':
          description: 'Missing (`Empty oauth2_access_token`), invalid, expired or
            revoked token. A 401 is NOT retryable: it''s a token state.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedInError'
        '403':
          description: Organization not administered by the token (ACCESS_DENIED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedInError'
        '404':
          description: Unknown entity or inactive organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedInError'
        '426':
          description: Retired or nonexistent version (`NONEXISTENT_VERSION`) — LinkedIn
            retires a version ~12 months after its release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedInError'
        '429':
          description: DAILY quota reached — reset at midnight UTC, WITHOUT a Retry-After
            header (key difference from BoondManager).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedInError'
        '500':
          description: Injected failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedInError'
        '503':
          description: Injected transient failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedInError'
